[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
# ============================================================================
# ROADMAP CLI - Local Project Management Tool
# ============================================================================
# USER INSTALLATION: uv tool install roadmap-cli
#   Installs the CLI and runtime dependencies in an isolated environment.
#
# DEVELOPMENT INSTALLATION: uv sync --all-extras --locked
#   Installs the locked runtime and development dependency sets.
# ============================================================================
name = "roadmap-cli"
version = "0.3.0"
description = "Git-native command line tool for local project roadmap management"
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = {text = "MIT"}
authors = [{name = "Shane Wilkins"}]
keywords = [
    "cli",
    "roadmap",
    "planning",
    "project-management",
    "milestone",
    "issue-tracking",
    "git",
    "offline",
    "productivity"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux"
]
dependencies = [
    "click>=8.4.0,<9.0.0",
    "rich>=15.0.0,<16.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "radon>=6.0.1",
    "xenon>=0.9.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.3.0",
    "pytest-aiohttp>=1.1.0",
    "ruff==0.16.6",
    "pre-commit>=4.6.0",
    "bandit[toml]>=1.9.4",
    "radon>=6.0.1,<7.0.0",
    "xenon>=0.9.3,<1.0.0",
    "pytest-xdist>=3.8.0",
    "pytest-benchmark>=5.2.3",
    "pyright>=1.1.411",
    "pytest-mock>=3.15.1",
    "ty>=0.0.77",
]

[project.urls]
Homepage = "https://github.com/shanewilkins/roadmap"
Repository = "https://github.com/shanewilkins/roadmap"
Issues = "https://github.com/shanewilkins/roadmap/issues"
Documentation = "https://github.com/shanewilkins/roadmap/tree/main/docs"

[project.scripts]
roadmap = "roadmap.bootstrap:main"

[tool.hatch.build]
exclude = [
    "/.venv",
    "/.venv/**",
    "/.venv_release",
    "/.venv_release/**",
    "/venv",
    "/venv/**",
    "/build/**",
    "/dist/**",
    "/htmlcov/**",
    "/.roadmap/**",
    "/.import_linter_cache/**",
]

[tool.hatch.build.targets.wheel]
packages = ["roadmap"]

[tool.hatch.build.targets.sdist]
include = [
    "/roadmap/**",
    "/README.md",
    "/LICENSE.md",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

# Tool configurations have been moved to config/ directory:
# - ruff.toml: Linting and formatting rules
# - bandit.toml: Security scanning configuration
# - .coveragerc: Test coverage thresholds and exclusions
# - pyrightconfig.json: Type checking configuration (current)

# ty runs alongside Pyright and is enforced in CI and pre-commit (0.3 quality
# cleanup, see notes/path_to_1_point_0.md).
[tool.ty.src]
include = ["roadmap", "tests"]
# These fixture trees are synthetic "roadmap" packages used only for the
# architecture checker's AST scan; they are never actually imported, so
# ty's import resolution has nothing real to check them against.
exclude = ["tests/policy/fixtures/architecture"]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--tb=short --strict-markers -n auto --maxfail=3 --strict-config -ra"
markers = [
    "unit: Unit tests (fast, no filesystem operations)",
    "integration: Integration tests (slower, with filesystem operations)",
    "filesystem: Tests that require real filesystem operations",
    "slow: Slow tests that may be skipped in CI",
    "performance: Performance-focused tests",
    "mock_scanning: Tests with mocked repository scanning operations",
    "no_xdist: Tests that should not run in parallel (disables xdist parallelization)"
]
filterwarnings = [
    "ignore::pytest_benchmark.logger.PytestBenchmarkWarning"
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
]

# Coverage configuration moved to config/.coveragerc
