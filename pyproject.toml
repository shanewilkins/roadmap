[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
# ============================================================================
# ROADMAP CLI - Enterprise Project Management Tool
# ============================================================================
# USER INSTALLATION: uv tool install roadmap-cli
#   Installs the CLI and runtime dependencies in an isolated environment.
#
# DEVELOPMENT INSTALLATION: uv sync --all-extras --locked
#   Installs the locked runtime and development dependency sets.
# ============================================================================
name = "roadmap-cli"
version = "0.1.1"
description = "Git-native command line tool for project roadmap management with GitHub integration and structured reporting"
readme = "README.md"
requires-python = ">=3.13,<4.0"
license = {text = "MIT"}
authors = [{name = "Roadmap CLI Team", email = "contact@roadmap-cli.com"}]
keywords = [
    "cli",
    "roadmap",
    "planning",
    "project-management",
    "github",
    "agile",
    "scrum",
    "milestone",
    "issue-tracking",
    "analytics",
    "visualization",
    "productivity"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux"
]
dependencies = [
    "click>=8.4.0,<9.0.0",
    "rich>=15.0.0,<16.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "requests>=2.34.2,<3.0.0",
    "keyring>=25.7.0,<26.0.0",
    "toml>=0.10.2,<1.0.0",
    "structlog>=25.5.0,<27.0.0",
    "dynaconf>=3.2.13,<4.0.0",
    "asyncclick>=8.3.0.7,<9.0.0",
    "tabulate>=0.10.0,<1.0.0",
    "opentelemetry-api>=1.42.0,<2.0.0",
    "opentelemetry-sdk>=1.42.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.42.0,<2.0.0",
    "urllib3>=2.6.3,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.3.0",
    "pytest-aiohttp>=1.1.0",
    "ruff==0.16.1",
    "pre-commit>=4.6.0",
    "bandit[toml]>=1.9.4",
    "radon>=6.0.1,<7.0.0",
    "xenon>=0.9.3,<1.0.0",
    "pytest-xdist>=3.8.0",
    "pytest-benchmark>=5.2.3",
    "pyright>=1.1.411",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
    "sphinx-click>=6.2.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocs-click>=0.9.0",
    "myst-parser>=5.1.0",
    "pytest-mock>=3.15.1",
]

[project.urls]
Homepage = "https://roadmap-cli.readthedocs.io"
Repository = "https://github.com/shanewilkins/roadmap"
Issues = "https://github.com/shanewilkins/roadmap/issues"
Documentation = "https://roadmap-cli.readthedocs.io"

[project.scripts]
roadmap = "roadmap.bootstrap:main"

[tool.hatch.build]
exclude = [
    "/.venv",
    "/.venv/**",
    "/.venv_release",
    "/.venv_release/**",
    "/venv",
    "/venv/**",
    "/build/**",
    "/dist/**",
    "/htmlcov/**",
    "/.roadmap/**",
    "/.import_linter_cache/**",
]

[tool.hatch.build.targets.wheel]
packages = ["roadmap"]

[tool.hatch.build.targets.sdist]
include = [
    "/roadmap/**",
    "/README.md",
    "/LICENSE.md",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

# Tool configurations have been moved to config/ directory:
# - ruff.toml: Linting and formatting rules
# - bandit.toml: Security scanning configuration
# - .coveragerc: Test coverage thresholds and exclusions
# - pyrightconfig.json: Type checking configuration

# Type checking is now handled by Pyright
# Configuration is in pyrightconfig.json

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--tb=short --strict-markers -n auto --maxfail=3 --strict-config -ra"
markers = [
    "unit: Unit tests (fast, no filesystem operations)",
    "integration: Integration tests (slower, with filesystem operations)",
    "filesystem: Tests that require real filesystem operations",
    "slow: Slow tests that may be skipped in CI",
    "performance: Performance-focused tests",
    "mock_scanning: Tests with mocked repository scanning operations",
    "no_xdist: Tests that should not run in parallel (disables xdist parallelization)"
]
filterwarnings = [
    "ignore::DeprecationWarning:dynaconf.base",
    "ignore::pytest_benchmark.logger.PytestBenchmarkWarning"
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
]

# Coverage configuration moved to config/.coveragerc
