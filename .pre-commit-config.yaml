# Keep commit-time checks deterministic and fast. Full verification runs in CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
        exclude: "^coverage-baseline\\.json$"
      - id: check-case-conflict
      - id: debug-statements
      - id: end-of-file-fixer
        exclude: ^\.roadmap/
      - id: trailing-whitespace
        exclude: ^\.roadmap/

  # Use the Ruff version pinned in pyproject.toml and uv.lock.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --config config/ruff.toml --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --config config/ruff.toml
        language: system
        types: [python]

      - id: radon-complexity-report
        name: radon complexity report
        entry: uv run --locked --extra dev radon cc roadmap --exclude */migrations/* --total-average --show-complexity --min D
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      - id: xenon-complexity
        name: xenon complexity gate
        entry: uv run --locked --extra dev xenon --exclude */migrations/* --max-absolute B --max-modules B --max-average A roadmap
        language: system
        pass_filenames: false
        always_run: true

      - id: ty-check
        name: ty check
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        always_run: true
