name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Python 3.14
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Check formatting
        run: uv run --locked ruff format --config config/ruff.toml --check roadmap tests

      - name: Lint
        run: uv run --locked ruff check --config config/ruff.toml roadmap tests

      - name: Enforce architecture contract
        run: uv run --locked python tests/policy/architecture_checker.py

      - name: Type check
        run: uv run --locked pyright

      - name: Scan for high-severity security issues
        run: uv run --locked bandit -c config/bandit.toml -r roadmap --severity-level=high

      - name: Report complexity with Radon
        run: >-
          uv run --locked radon cc roadmap
          --exclude '*/migrations/*'
          --total-average
          --show-complexity
          --min D

      - name: Enforce complexity with Xenon
        run: >-
          uv run --locked xenon
          --exclude '*/migrations/*'
          --max-absolute C
          --max-modules C
          --max-average A
          roadmap

      - name: Test with coverage
        run: >-
          uv run --locked pytest
          --cov=roadmap
          --cov-config=config/.coveragerc
          --cov-report=term-missing

  package-compatibility:
    name: Package Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build wheel and source distribution
        run: uv build --out-dir dist

      - name: Smoke test wheel
        run: python scripts/smoke_package.py dist/*.whl

      - name: Smoke test source distribution
        run: python scripts/smoke_package.py dist/*.tar.gz
