name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --all-extras --locked --python 3.14

      - name: Validate GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

      - name: Check formatting
        run: uv run --locked ruff format --config config/ruff.toml --check roadmap tests

      - name: Lint
        run: uv run --locked ruff check --config config/ruff.toml roadmap tests

      - name: Enforce architecture contract
        run: uv run --locked python tests/policy/architecture_checker.py

      - name: Type check (pyright)
        run: uv run --locked pyright

      - name: Type check (ty)
        run: uv run --locked ty check

      - name: Scan for high-severity security issues
        run: uv run --locked bandit -c config/bandit.toml -r roadmap --severity-level=high

      - name: Report complexity with Radon
        run: >-
          uv run --locked radon cc roadmap
          --exclude '*/migrations/*'
          --total-average
          --show-complexity
          --min D

      - name: Enforce complexity with Xenon
        run: >-
          uv run --locked xenon
          --exclude '*/migrations/*'
          --max-absolute B
          --max-modules B
          --max-average A
          roadmap

  tests:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-extras --locked --python ${{ matrix.python-version }}

      - name: Test
        if: matrix.python-version != '3.14'
        run: uv run --locked pytest

      - name: Test with coverage
        if: matrix.python-version == '3.14'
        run: >-
          uv run --locked pytest
          --cov=roadmap
          --cov-config=config/.coveragerc
          --cov-report=term-missing

  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"

      - name: Build wheel and source distribution
        run: uv build --out-dir dist

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  package-compatibility:
    name: Package on ${{ matrix.label }} with Python ${{ matrix.python-version }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu 24.04 x64
            os: ubuntu-24.04
            python-version: "3.12"
          - label: Ubuntu 24.04 x64
            os: ubuntu-24.04
            python-version: "3.14"
          - label: macOS 15 ARM64
            os: macos-15
            python-version: "3.12"
          - label: macOS 15 ARM64
            os: macos-15
            python-version: "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-python-distributions
          path: dist/

      - name: Smoke test wheel
        run: python scripts/smoke_package.py dist/*.whl

      - name: Smoke test source distribution
        run: python scripts/smoke_package.py dist/*.tar.gz

      - name: Install wheel for the cumulative journey
        run: |
          python -m venv .package-journey
          .package-journey/bin/python -m pip install dist/*.whl

      - name: Run cumulative installed journey
        run: >-
          python scripts/checkpoint_journey.py
          --roadmap-command .package-journey/bin/roadmap

  result:
    name: CI result
    if: ${{ always() }}
    needs: [quality, tests, build, package-compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Require every CI job
        run: |
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.tests.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.package-compatibility.result }}" = "success"
