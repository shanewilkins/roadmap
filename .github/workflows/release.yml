name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"

      - name: Verify tag matches project version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as file:
              project_version = tomllib.load(file)["project"]["version"]
          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if tag_version != project_version:
              raise SystemExit(
                  f"Tag {tag_version!r} does not match project version "
                  f"{project_version!r}"
              )
          PY

      - name: Build wheel and source distribution
        run: uv build --out-dir dist

      - name: Smoke test wheel
        run: python scripts/smoke_package.py dist/*.whl

      - name: Smoke test source distribution
        run: python scripts/smoke_package.py dist/*.tar.gz

      - name: Run cumulative journey against the wheel
        run: |
          python -m venv .package-journey
          .package-journey/bin/python -m pip install dist/*.whl
          python scripts/checkpoint_journey.py --roadmap-command .package-journey/bin/roadmap

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/roadmap-cli
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
