name: Publish Roadmap closures

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: roadmap-github-closures
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"

      - name: Install locked runtime
        run: uv sync --locked --no-dev

      - name: Preview committed closure decisions
        env:
          ROADMAP_REPOSITORY: ${{ github.repository }}
        run: uv run --locked roadmap github publish-closures --repo "$ROADMAP_REPOSITORY"

      - name: Publish closure decisions
        env:
          GH_TOKEN: ${{ github.token }}
          ROADMAP_REPOSITORY: ${{ github.repository }}
        run: uv run --locked roadmap github publish-closures --repo "$ROADMAP_REPOSITORY" --apply
